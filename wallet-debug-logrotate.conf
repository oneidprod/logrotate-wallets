# Wallet debug.log logrotate config
# Matches debug.log in any hidden-directory wallet under any user's home.
#
# Deploy: sudo cp wallet-debug-logrotate.conf /etc/logrotate.d/wallet-debug
# Test:   sudo logrotate -d /etc/logrotate.d/wallet-debug
# Force:  sudo logrotate -f /etc/logrotate.d/wallet-debug

/home/*/.*/debug.log
{
    su root root
    size 100M
    rotate 3
    compress
    delaycompress
    missingok
    notifempty
    copytruncate
    dateext
    dateformat -%Y%m%d-%H%M%S
}
